name: BuildApp CI

on:
  push:
    branches:
      - main
      - "claude/**"
      - "orchestrator/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: buildapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  core:
    name: Core / Analyzer / Reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit / integration / architecture tests
        run: npm test
      - name: Production web build
        run: npm run build
      - name: Marcówki semantic audit
        run: npm run audit:marcowki
      - name: Marcówki facade audit
        run: npm run audit:marcowki:facades
      - name: Prove reconstruction works with reference package absent
        run: npm run reconstruct:no-reference
      - name: Analyzer-v2 gates
        run: npm run audit:analyzer-v2
      - name: Prove analyzer-v2 works with the benchmark absent
        run: npm run reconstruct:no-benchmark
      - name: Evaluate the v2 candidate against source truth v2
        run: npm run evaluate:v2
      - name: Exterior closure audit (candidate under review against the one it replaces)
        # Fails on any EXTERIOR closure error of the candidate under review:
        # shared volume, a face drawn twice, a crack between members that
        # meet, a free railing end, a terrace off its datum.
        run: npm run audit:exterior
      - name: Upload exterior closure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exterior-closure
          if-no-files-found: ignore
          retention-days: 14
          path: |
            stage-reports/artifacts/exterior-closure/**
            stage-reports/artifacts/analyzer-v2/marcowki-exterior-closure-evaluation.*
      - name: Upload analyzer-v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-v2
          if-no-files-found: ignore
          retention-days: 14
          path: stage-reports/artifacts/analyzer-v2/**
      - name: Upload reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            stage-reports/artifacts/reconstruction/**
            .cache/no-reference/**

  browser:
    name: Browser / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production browser verification
        run: npm run e2e
      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/web/test-results/**
            stage-reports/artifacts/**/*.png

  android:
    name: Android / APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Optional private preview signing identity. These are empty unless the
      # repository defines secrets of the same names, and the Gradle script
      # treats empty as unset: the APKs are then signed with the committed
      # preview key (apps/android/keystore/README.md), which is what gives
      # every CI build the same signature and lets it install over the last.
      BUILDPLAN_PREVIEW_KEYSTORE_BASE64: ${{ secrets.BUILDPLAN_PREVIEW_KEYSTORE_BASE64 }}
      BUILDPLAN_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.BUILDPLAN_PREVIEW_KEYSTORE_PASSWORD }}
      BUILDPLAN_PREVIEW_KEY_ALIAS: ${{ secrets.BUILDPLAN_PREVIEW_KEY_ALIAS }}
      BUILDPLAN_PREVIEW_KEY_PASSWORD: ${{ secrets.BUILDPLAN_PREVIEW_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Ensure Android 35 SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install JS dependencies
        run: npm ci
      - name: Regenerate mobile scene bundles
        run: npm run mobile:export-scenes
      - name: Assert committed mobile bundles are current
        run: git diff --exit-code -- apps/android/app/src/main/assets/scenes
      - name: Android JVM tests
        run: npm run android:test
      - name: Private preview signing key (only when the secret is defined)
        if: env.BUILDPLAN_PREVIEW_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$BUILDPLAN_PREVIEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.keystore"
          echo "BUILDPLAN_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview.keystore" >> "$GITHUB_ENV"
      - name: Assemble preview APKs
        # versionCode = 1000 + GITHUB_RUN_NUMBER and versionName = 0.<run>.0-preview
        # are derived by app/build.gradle.kts from the environment GitHub sets;
        # nothing to pass here. The result is signed with the preview key.
        run: npm run android:assembleDebug
      - name: Verify the signer and record the preview version
        run: |
          apps/android/tools/verify-preview-signature.sh
          {
            echo '### BuildPlan Model Preview APKs'
            echo
            echo 'Signed with the preview key: a phone with an earlier preview build installs this one as an update.'
            echo
            echo '```'
            cat apps/android/app/build/preview-apks/VERSION.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: buildplan-model-preview-apks
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/android/app/build/preview-apks/*.apk
            apps/android/app/build/preview-apks/VERSION.txt

  dependency-security:
    name: Dependency security (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
