name: BuildApp CI

on:
  push:
    branches:
      - main
      - "claude/**"
      - "orchestrator/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: buildapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  core:
    name: Core / Analyzer / Reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit / integration / architecture tests
        # includes the analysis service, the analyzer HTTP API (lifecycle,
        # cancel, timeout, isolation, SSRF, limits, worker threads) and the
        # architecture test that bundles the API and checks what went in
        run: npm test
      - name: Analyzer API bundle
        run: npm run build --workspace apps/analyzer-api
      - name: Analyzer API smoke (the bundle, over HTTP)
        run: node apps/analyzer-api/scripts/smoke.mjs
        env:
          ANALYZER_LOG: "0"
      - name: Production web build
        run: npm run build
      - name: Marcówki semantic audit
        run: npm run audit:marcowki
      - name: Marcówki facade audit
        run: npm run audit:marcowki:facades
      - name: Prove reconstruction works with reference package absent
        run: npm run reconstruct:no-reference
      - name: Analyzer-v2 gates
        run: npm run audit:analyzer-v2
      - name: Prove analyzer-v2 works with the benchmark absent
        run: npm run reconstruct:no-benchmark
      - name: Evaluate the v2 candidate against source truth v2
        run: npm run evaluate:v2
      - name: Exterior closure audit (candidate under review against the one it replaces)
        # Fails on any EXTERIOR closure error of the candidate under review:
        # shared volume, a face drawn twice, a crack between members that
        # meet, a free railing end, a terrace off its datum.
        run: npm run audit:exterior
      - name: Upload exterior closure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exterior-closure
          if-no-files-found: ignore
          retention-days: 14
          path: |
            stage-reports/artifacts/exterior-closure/**
            stage-reports/artifacts/analyzer-v2/marcowki-exterior-closure-evaluation.*
      - name: Upload analyzer-v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-v2
          if-no-files-found: ignore
          retention-days: 14
          path: stage-reports/artifacts/analyzer-v2/**
      - name: Upload reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            stage-reports/artifacts/reconstruction/**
            .cache/no-reference/**

  analyzer-image:
    name: Analyzer API / container
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22 (runs the smoke script only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the image
        run: docker build -f apps/analyzer-api/Dockerfile -t buildapp-analyzer:ci .
      - name: Start the container
        run: docker run -d --name analyzer -p 8080:8080 buildapp-analyzer:ci
      - name: Smoke the container over HTTP
        run: node apps/analyzer-api/scripts/smoke.mjs --base http://127.0.0.1:8080
      - name: A real project URL through the container (advisory — depends on a third-party site)
        continue-on-error: true
        run: >-
          node apps/analyzer-api/scripts/smoke.mjs --base http://127.0.0.1:8080
          --analyze "https://www.archon.pl/projekty-domow/projekt-dom-w-marcowkach-ge-m2fa281446a8ca"
          --timeout-s 900 --out analyzer-live
      - name: Container health and log
        if: always()
        run: |
          docker inspect --format 'health: {{.State.Health.Status}}' analyzer || true
          docker logs analyzer 2>&1 | tail -n 60 || true
      - name: Upload the live run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-live-run
          if-no-files-found: ignore
          retention-days: 14
          path: analyzer-live/**

  analyzer-deploy:
    # Deploys the analyzer API to Fly.io when, and only when, the repository
    # has a FLY_API_TOKEN secret (docs/ANALYZER_API.md → Deployment). Without
    # it this job only says so: nothing pretends a service exists.
    name: Analyzer API / deploy
    needs: [core, analyzer-image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ANALYZER_API_BASE_URL: ${{ vars.ANALYZER_API_BASE_URL }}
    steps:
      - name: Is a deployment configured?
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "### Analyzer API not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository has no FLY_API_TOKEN secret, so CI does not deploy the analyzer service. APKs from this run have ANALYZER_API_BASE_URL='${ANALYZER_API_BASE_URL}'." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout
        if: env.FLY_API_TOKEN != ''
        uses: actions/checkout@v4
      - name: Node 22
        if: env.FLY_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy . --config apps/analyzer-api/fly.toml --dockerfile apps/analyzer-api/Dockerfile --remote-only
      - name: Smoke the deployment
        if: env.FLY_API_TOKEN != '' && env.ANALYZER_API_BASE_URL != ''
        run: node apps/analyzer-api/scripts/smoke.mjs --base "$ANALYZER_API_BASE_URL"

  browser:
    name: Browser / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production browser verification
        run: npm run e2e
      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/web/test-results/**
            stage-reports/artifacts/**/*.png

  android:
    name: Android / APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Optional private preview signing identity. These are empty unless the
      # repository defines secrets of the same names, and the Gradle script
      # treats empty as unset: the APKs are then signed with the committed
      # preview key (apps/android/keystore/README.md), which is what gives
      # every CI build the same signature and lets it install over the last.
      BUILDPLAN_PREVIEW_KEYSTORE_BASE64: ${{ secrets.BUILDPLAN_PREVIEW_KEYSTORE_BASE64 }}
      BUILDPLAN_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.BUILDPLAN_PREVIEW_KEYSTORE_PASSWORD }}
      BUILDPLAN_PREVIEW_KEY_ALIAS: ${{ secrets.BUILDPLAN_PREVIEW_KEY_ALIAS }}
      BUILDPLAN_PREVIEW_KEY_PASSWORD: ${{ secrets.BUILDPLAN_PREVIEW_KEY_PASSWORD }}
      # The analyzer service's public address, compiled into BuildConfig. A
      # repository VARIABLE, not a secret: it is a URL, and the APK carries no
      # credential for it. Empty when no service is deployed; the app then
      # says so and lets the owner enter an address.
      ANALYZER_API_BASE_URL: ${{ vars.ANALYZER_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Ensure Android 35 SDK, the NDK and CMake
        # NDK + CMake build the JNI bridge to the embedded Node runtime (BUILDAPP-03Y2)
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Install JS dependencies
        run: npm ci
      - name: Regenerate mobile scene bundles
        run: npm run mobile:export-scenes
      - name: Assert committed mobile bundles are current
        run: git diff --exit-code -- apps/android/app/src/main/assets/scenes
      - name: Android JVM tests
        run: npm run android:test
      - name: Private preview signing key (only when the secret is defined)
        if: env.BUILDPLAN_PREVIEW_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$BUILDPLAN_PREVIEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.keystore"
          echo "BUILDPLAN_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview.keystore" >> "$GITHUB_ENV"
      - name: Assemble preview APKs
        # versionCode = 1000 + GITHUB_RUN_NUMBER and versionName = 0.<run>.0-preview
        # are derived by app/build.gradle.kts from the environment GitHub sets;
        # nothing to pass here. The result is signed with the preview key.
        run: npm run android:assembleDebug
      - name: Verify the signer and record the preview version
        run: |
          apps/android/tools/verify-preview-signature.sh
          {
            echo '### BuildPlan Model Preview APKs'
            echo
            echo 'Signed with the preview key: a phone with an earlier preview build installs this one as an update.'
            echo
            echo '```'
            cat apps/android/app/build/preview-apks/VERSION.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The APK asks for the network and nothing else
        # INTERNET is the one permission the Analyzer adds. The other line
        # AndroidX's core library adds by itself: a signature permission the
        # app defines for its own not-exported broadcast receivers, which
        # grants no access to anything on the phone.
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          for apk in apps/android/app/build/preview-apks/*.apk; do
            perms=$("$AAPT" dump permissions "$apk" | sed -nE "s/^uses-permission: name='([^']+)'.*/\1/p" | sort -u | tr '\n' ' ')
            echo "$(basename "$apk"): $perms"
            [ "$perms" = "android.permission.INTERNET com.buildplan.preview.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION " ] || { echo "::error::unexpected permissions in $apk: $perms"; exit 1; }
          done
          echo "Analyzer service compiled in: '${ANALYZER_API_BASE_URL}'" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: buildplan-model-preview-apks
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/android/app/build/preview-apks/*.apk
            apps/android/app/build/preview-apks/VERSION.txt

  local-analyzer-host:
    # BUILDAPP-03Y2. The analyzer bundle the APK embeds, run on this machine
    # exactly as the phone runs it, under Node 18.20.4 — the version of the
    # runtime inside the APK (nodejs-mobile) — and under Node 22, against the
    # desktop pipeline (runAnalysis from the TypeScript sources).
    name: Local analyzer / Node 18 parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARCOWKI_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-marcowkach-ge-m2fa281446a8ca
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Node 18.20.4 (the runtime version inside the APK)
        run: |
          curl -fsSL https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "LOCAL_ANALYZER_NODE18=$RUNNER_TEMP/node-v18.20.4-linux-x64/bin/node" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/node-v18.20.4-linux-x64/bin/node" --version
      - name: Parity, cancel and cleanup under Node 22 and Node 18; architecture gates
        run: npx vitest run apps/local-analyzer tests/architecture/local-analyzer.test.ts
      - name: Fixture parity record (desktop pipeline vs the bundle on Node 18 and 22)
        run: |
          mkdir -p local-analyzer-host
          node apps/local-analyzer/build.mjs --fixture
          npx vite-node apps/local-analyzer/scripts/desktop-hashes.ts -- --out local-analyzer-host/desktop-fixture.json
          node apps/local-analyzer/scripts/run-host.mjs --dir apps/local-analyzer/dist --fixture --node "$LOCAL_ANALYZER_NODE18" --url https://drawings.synthetic-publisher.test/projects/larchfield-lf01 > local-analyzer-host/bundle-node18-fixture.json
          node apps/local-analyzer/scripts/run-host.mjs --dir apps/local-analyzer/dist --fixture --url https://drawings.synthetic-publisher.test/projects/larchfield-lf01 > local-analyzer-host/bundle-node22-fixture.json
          node -e "
            const d = require('./local-analyzer-host/desktop-fixture.json')
            const keys = ['candidateHash','modelHash','sceneContentHash','sceneSha256']
            for (const f of ['bundle-node18-fixture.json','bundle-node22-fixture.json']) {
              const s = JSON.parse(require('fs').readFileSync('local-analyzer-host/' + f, 'utf8')).terminal.summary
              for (const k of keys) if (s[k] !== d[k]) { console.error(f, k, s[k], '!=', d[k]); process.exit(1) }
            }
            console.log('fixture parity: desktop = bundle on Node 18 = bundle on Node 22', keys.map(k => k + ' ' + d[k].slice(0, 12)).join(', '))
          "
      - name: The text adapter's tables are what this ICU generates
        # Android's runtime has no ICU (nodejs-mobile builds --with-intl=none); src/text-tables.ts
        # stands in for it and must be exactly what the desktop's ICU says (about three minutes)
        run: node apps/local-analyzer/scripts/generate-text-tables.mjs --check
      - name: The real Marcówki URL through the bundle on Node 18, with ICU and as on Android without it (advisory — depends on a third-party site)
        continue-on-error: true
        run: |
          node apps/local-analyzer/scripts/run-host.mjs --dir apps/local-analyzer/dist --node "$LOCAL_ANALYZER_NODE18" --url "$MARCOWKI_URL" --events local-analyzer-host/marcowki-node18-events.ndjson > local-analyzer-host/marcowki-node18.json
          node apps/local-analyzer/scripts/run-host.mjs --dir apps/local-analyzer/dist --node "$LOCAL_ANALYZER_NODE18" --no-icu --url "$MARCOWKI_URL" --events local-analyzer-host/marcowki-node18-no-icu-events.ndjson > local-analyzer-host/marcowki-node18-no-icu.json
          node apps/local-analyzer/scripts/compare-runs.mjs --device local-analyzer-host/marcowki-node18-no-icu.json --desktop local-analyzer-host/marcowki-node18.json --md local-analyzer-host/marcowki-no-icu-vs-icu.md
          { echo "### Marcówki on Node 18: without ICU (text adapter) vs with ICU"; echo; cat local-analyzer-host/marcowki-no-icu-vs-icu.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the host parity record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-analyzer-host
          if-no-files-found: ignore
          retention-days: 30
          path: local-analyzer-host/**

  local-analyzer-device:
    # BUILDAPP-03Y2. The APK with the embedded analyzer: its exact size against
    # the same commit built without it, and the analyzer running ON Android —
    # an x86_64 emulator with KVM, the real nodejs-mobile runtime, the
    # production analyzer.mjs from the app's assets — held to the desktop
    # pipeline's hashes, cancelled while downloading and while computing, and
    # (advisory) run on the real Marcówki URL and compared with the desktop.
    name: Local analyzer / APK size + emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MARCOWKI_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-marcowkach-ge-m2fa281446a8ca
      SECOND_HOUSE_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-rarytasach-5-g2e-m84f2903cb8e14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Android 35 SDK, the NDK and CMake
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Install JS dependencies
        run: npm ci
      - name: APKs WITHOUT the local analyzer (the size baseline; clean build)
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon assembleDebug -PlocalAnalyzer=false
          mkdir -p "$RUNNER_TEMP/apk-without"
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/apk-without/"
      - name: APKs WITH the local analyzer, and the instrumentation test APK (clean build)
        working-directory: apps/android
        run: ./gradlew --no-daemon clean assembleDebug assembleDebugAndroidTest
      - name: APK size report (measured from the files)
        run: |
          mkdir -p local-analyzer-device
          for abi in arm64-v8a x86_64; do
            node apps/android/tools/apk-size-report.mjs \
              --local "apps/android/app/build/outputs/apk/debug/app-$abi-debug.apk" \
              --without "$RUNNER_TEMP/apk-without/app-$abi-debug.apk" \
              --runtime-json apps/android/third_party/nodejs-mobile/runtime.json \
              --meta apps/android/app/build/local-analyzer/meta.json \
              --out "local-analyzer-device/size-$abi.json" --md "local-analyzer-device/size-$abi.md"
          done
          {
            echo "### Local analyzer — APK size, arm64-v8a"; echo; cat local-analyzer-device/size-arm64-v8a.md; echo
            echo "### Local analyzer — APK size, x86_64 (the emulator's)"; echo; cat local-analyzer-device/size-x86_64.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The desktop pipeline's hashes for the device fixture
        run: npx vite-node apps/local-analyzer/scripts/desktop-hashes.ts -- --out local-analyzer-device/desktop-fixture.json
      - name: The real Marcówki URL on the desktop, through the exact bundle the APK ships (advisory)
        continue-on-error: true
        run: |
          # the bundle is taken out of the built APK itself: these are the bytes the phone runs
          unzip -o -q apps/android/app/build/outputs/apk/debug/app-x86_64-debug.apk 'assets/local-analyzer/*' -d "$RUNNER_TEMP/apk-bundle"
          node apps/local-analyzer/scripts/run-host.mjs --dir "$RUNNER_TEMP/apk-bundle/assets/local-analyzer" \
            --url "$MARCOWKI_URL" --events local-analyzer-device/desktop-live-events.ndjson > local-analyzer-device/desktop-live.json
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The local analyzer on Android (emulator x86_64, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DESKTOP_FIXTURE: local-analyzer-device/desktop-fixture.json
          LIVE_URL: ${{ env.MARCOWKI_URL }}
          # BUILDAPP-03Y2G: the second regression project, on the device too (advisory, like the first)
          SECOND_LIVE_URL: ${{ env.SECOND_HOUSE_URL }}
          LIVE_TIMEOUT_MINUTES: "40"
          OUT: local-analyzer-device/device
        with:
          api-level: 34
          target: default
          arch: x86_64
          cores: 4
          ram-size: 6144M
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash apps/android/tools/run-device-tests.sh
      - name: What the runs on the emulator cost
        if: always()
        run: |
          node apps/local-analyzer/scripts/device-summary.mjs local-analyzer-device/device/local-analyzer-reports --md local-analyzer-device/device-summary.md || true
          {
            echo "### Local analyzer on the emulator (CI/emulator measured — not a phone)"; echo
            cat local-analyzer-device/device/device.txt 2>/dev/null | sed 's/^/    /'; echo
            cat local-analyzer-device/device-summary.md 2>/dev/null
            echo; echo "Live URL on the device: $(cat local-analyzer-device/device/live-status.txt 2>/dev/null || echo LIVE_ANDROID_ANALYSIS_NOT_RUN)"
            echo; echo "Second house on the device: $(cat local-analyzer-device/device/live-second-house-status.txt 2>/dev/null || echo LIVE_ANDROID_ANALYSIS_NOT_RUN)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Device vs desktop on the real URL (advisory)
        if: always()
        continue-on-error: true
        run: |
          node apps/local-analyzer/scripts/compare-runs.mjs \
            --device local-analyzer-device/device/local-analyzer-reports/live.json \
            --desktop local-analyzer-device/desktop-live.json \
            --md local-analyzer-device/live-comparison.md
          { echo "### Marcówki: device vs desktop"; echo; cat local-analyzer-device/live-comparison.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the device and size record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-analyzer-device
          if-no-files-found: ignore
          retention-days: 30
          path: local-analyzer-device/**

  second-house-generalization:
    # BUILDAPP-03Y2G. A second real project beside Marcówki, kept as a
    # regression project. The analyzer is gated here, not the publisher: the
    # live URL must complete through the production pipeline, its own sealed
    # evidence must replay offline to the same hashes, the evidence the
    # analyzer read before this stage must still be refused, by name, and the
    # bundle the APK embeds must reach the same model on Node 18 without ICU,
    # as on Android. When the publisher cannot be reached, the run is recorded
    # and warned about instead of failing: that is not an analyzer failure.
    name: Second house / generalization
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SECOND_HOUSE_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-rarytasach-5-g2e-m84f2903cb8e14
      SEALED: stage-reports/artifacts/rarytasy-generalization
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Node 18.20.4 (the runtime version inside the APK)
        run: |
          curl -fsSL https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "LOCAL_ANALYZER_NODE18=$RUNNER_TEMP/node-v18.20.4-linux-x64/bin/node" >> "$GITHUB_ENV"
      - name: The live URL through the production pipeline (must complete)
        run: |
          mkdir -p second-house
          npm run -s analysis:second-house -- --url "$SECOND_HOUSE_URL" --out second-house/live --cache .cache/second-house-bytes --expect COMPLETED --tolerate-source-outage | tee second-house/live.log
      - name: Its sealed evidence, replayed offline, gives the same candidate, model and scene
        run: |
          if [ ! -f second-house/live/result-summary.json ]; then echo "::warning::no completed live run to replay"; exit 0; fi
          OFFLINE=1 npm run -s analysis:second-house -- --package second-house/live/source-package.json --graph second-house/live/observation-graph.json \
            --out second-house/replay --cache .cache/second-house-bytes --expect COMPLETED --same-as second-house/live/result-summary.json
      - name: The pre-fix evidence through today's solver is refused by name, not by ANALYSIS_FAILED
        run: |
          if [ ! -d .cache/second-house-bytes ]; then echo "::warning::no plan images fetched; nothing to replay"; exit 0; fi
          npm run -s analysis:second-house -- --package "$SEALED/pre-fix/source-package.json" --graph "$SEALED/pre-fix/observation-graph.json" \
            --metrics "$SEALED/pre-fix/metric-evidence.json" --out second-house/pre-fix --cache .cache/second-house-bytes --expect FAILED
          node -e "
            const f = require('./second-house/pre-fix/failure.json')
            if (f.code !== 'RECONSTRUCTION_FAILED' || f.reasonCode !== 'PLAN_LAYOUT_REJECTED') { console.error('expected RECONSTRUCTION_FAILED / PLAN_LAYOUT_REJECTED, got', f.code, f.reasonCode); process.exit(1) }
            console.log('pre-fix evidence:', f.code, '/', f.reasonCode, 'in', f.stage, '/', f.substage)
          "
      - name: The committed post-fix evidence replays to the committed hashes (advisory — needs the publisher's images, which are not committed)
        continue-on-error: true
        run: |
          OFFLINE=1 npm run -s analysis:second-house -- --package "$SEALED/post-fix/source-package.json" --graph "$SEALED/post-fix/observation-graph.json" \
            --out second-house/committed-replay --cache .cache/second-house-bytes --expect COMPLETED --same-as "$SEALED/post-fix/result-summary.json"
      - name: The bundle the APK embeds, on Node 18 without ICU as on Android, reaches the same model and scene
        run: |
          node apps/local-analyzer/build.mjs
          node apps/local-analyzer/scripts/run-host.mjs --dir apps/local-analyzer/dist --node "$LOCAL_ANALYZER_NODE18" --no-icu --url "$SECOND_HOUSE_URL" \
            --events second-house/node18-no-icu-events.ndjson > second-house/node18-no-icu.json || true
          node -e "
            const fs = require('fs')
            const run = JSON.parse(fs.readFileSync('second-house/node18-no-icu.json', 'utf8')).terminal ?? {}
            if (run.type === 'failed' && run.code === 'SOURCE_UNREACHABLE') { console.log('::warning::the publisher could not be reached from the Node 18 run'); process.exit(0) }
            if (run.type !== 'done') { console.error('the bundle on Node 18 did not complete:', JSON.stringify(run).slice(0, 600)); process.exit(1) }
            if (!fs.existsSync('second-house/live/result-summary.json')) { console.log('::warning::no desktop run to compare with'); process.exit(0) }
            const desktop = require('./second-house/live/result-summary.json')
            // two fetches of one page seal different packages (the page itself changes), so the
            // candidate, which cites its package, differs; the model and scene must not
            const keys = ['modelHash', 'sceneContentHash', 'sceneSha256']
            const differ = keys.filter((k) => run.summary[k] !== desktop[k])
            if (differ.length) { for (const k of differ) console.error(k, run.summary[k], '!=', desktop[k]); process.exit(1) }
            console.log('desktop = bundle on Node 18 (no ICU):', keys.map((k) => k + ' ' + desktop[k].slice(0, 12)).join(', '), '; peak RSS', run.metrics?.memory?.peakRssBytes, 'bytes,', run.metrics?.elapsedMs, 'ms')
          "
      - name: Summary
        if: always()
        run: |
          {
            echo "### Second house (BUILDAPP-03Y2G)"; echo
            echo '```'; tail -n 12 second-house/live.log 2>/dev/null; echo '```'
            for f in second-house/live/failure.json second-house/pre-fix/failure.json; do
              [ -f "$f" ] && { echo "$f:"; echo '```'; node -e "const f=require('./$f'); console.log(f.code, '/', f.reasonCode, '—', f.stage, '/', f.substage, '—', f.message)"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the second-house record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-house-generalization
          if-no-files-found: ignore
          retention-days: 30
          path: |
            second-house/**
            !second-house/**/observation-graph.json

  architectural-assemblies:
    # BUILDAPP-03G. The architectural language as a review record: the
    # capability, primitive, assembly and relationship registries; the
    # seventeen synthetic diversity fixtures through validation, DSL replay,
    # round trip, compile and the closure audit; the hypothesis pipeline
    # demonstrations (synthetic evidence only); the roof graph (JSON + SVG) and
    # assembly graph of every fixture, of sealed Marcówki auto v3 and of the
    # second house's live model from the job before. Fails when a fixture or a
    # demonstration fails. The second house is optional input: a publisher
    # outage there leaves its graphs out with a warning, not a red job.
    name: Architecture / assemblies
    needs: second-house-generalization
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: The second house's live model (from the second-house job)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: second-house-generalization
          path: second-house
      - name: Registries, fixtures, demonstrations, roof and assembly graphs, regressions
        run: npm run -s architecture:artifacts -- --out architectural-assemblies --rarytasy second-house/live/model.json
      - name: Summary
        if: always()
        run: |
          {
            echo "### Architectural assemblies (BUILDAPP-03G)"; echo
            cat architectural-assemblies/README.md 2>/dev/null; echo
            cat architectural-assemblies/regression-summary.md 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the architectural-assemblies record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architectural-assemblies
          if-no-files-found: error
          retention-days: 30
          path: architectural-assemblies/**

  preview-release:
    # BUILDAPP-03Y2G: one direct, stable download link for the owner's phone —
    # a GitHub prerelease `preview-latest` whose asset is the arm64 APK itself,
    # BuildPlan-Preview-arm64.apk, not a zip. Re-created on every push to the
    # development branch or main, from the APK the Android job built and
    # verified (same preview signing key, versionCode 1000 + run number, so a
    # phone installs each as an update of the last).
    name: Android / direct APK (preview-latest)
    needs: android
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/buildapp-buildworld-v1-7y6yqh')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The APKs the Android job built
        uses: actions/download-artifact@v4
        with:
          name: buildplan-model-preview-apks
          path: apks
      - name: Publish BuildPlan-Preview-arm64.apk to the preview-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src="apks/BuildPlan-Model-Preview-arm64-v8a-debug.apk"
          [ -f "$src" ] || { echo "::error::no arm64 APK in the Android job's artifact"; ls -la apks; exit 1; }
          cp "$src" BuildPlan-Preview-arm64.apk
          sha=$(sha256sum BuildPlan-Preview-arm64.apk | cut -d' ' -f1)
          {
            echo "BuildPlan Model Preview — arm64 (the owner's phone)."
            echo
            echo "Direct download: https://github.com/${GH_REPO}/releases/download/preview-latest/BuildPlan-Preview-arm64.apk"
            echo
            echo "Built by run ${GITHUB_RUN_NUMBER} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}."
            echo "SHA-256 ${sha}"
            echo
            echo '```'; cat apks/VERSION.txt; echo '```'
            echo
            echo "Signed with the preview key: it installs over any earlier preview build."
          } > notes.md
          gh release delete preview-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create preview-latest BuildPlan-Preview-arm64.apk apks/VERSION.txt \
            --prerelease --target "$GITHUB_SHA" --title "BuildPlan Preview (latest, arm64)" --notes-file notes.md
          url="https://github.com/${GH_REPO}/releases/download/preview-latest/BuildPlan-Preview-arm64.apk"
          echo "### Direct APK" >> "$GITHUB_STEP_SUMMARY"
          echo "$url (SHA-256 $sha)" >> "$GITHUB_STEP_SUMMARY"

  dependency-security:
    name: Dependency security (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
