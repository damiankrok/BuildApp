name: BuildApp CI

on:
  push:
    branches:
      - main
      - "claude/**"
      - "orchestrator/**"
  pull_request:
  workflow_dispatch:
    inputs:
      owner_apk:
        # A diagnostic dispatch (evidence only) must not replace the OWNER's
        # installed test build; the default keeps every other dispatch as it was.
        description: "Publish the arm64 APK to owner-preview-latest"
        type: boolean
        default: true
      only_ui_evidence:
        # INTEGRATION-003C: a diagnostic dispatch that runs the UI evidence gate
        # alone (the audit cycles' screenshots). Never publishes anything.
        description: "Run only the UI evidence gate"
        type: boolean
        default: false
      ui_slices:
        description: "UI evidence: also analyse the Marcówki, Rarytasy, Kosaćce and alternate-publisher links through the app"
        type: boolean
        default: true

concurrency:
  group: buildapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  core:
    name: Core / Analyzer / Reconstruction
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit / integration / architecture tests
        # includes the analysis service, the analyzer HTTP API (lifecycle,
        # cancel, timeout, isolation, SSRF, limits, worker threads) and the
        # architecture test that bundles the API and checks what went in
        run: npm test
      - name: Analyzer API bundle
        run: npm run build --workspace apps/analyzer-api
      - name: Analyzer API smoke (the bundle, over HTTP)
        run: node apps/analyzer-api/scripts/smoke.mjs
        env:
          ANALYZER_LOG: "0"
      - name: Production web build
        run: npm run build
      - name: Marcówki semantic audit
        run: npm run audit:marcowki
      - name: Marcówki facade audit
        run: npm run audit:marcowki:facades
      - name: Prove reconstruction works with reference package absent
        run: npm run reconstruct:no-reference
      - name: Analyzer-v2 gates
        run: npm run audit:analyzer-v2
      - name: Prove analyzer-v2 works with the benchmark absent
        run: npm run reconstruct:no-benchmark
      - name: Evaluate the v2 candidate against source truth v2
        run: npm run evaluate:v2
      - name: Exterior closure audit (candidate under review against the one it replaces)
        # Fails on any EXTERIOR closure error of the candidate under review:
        # shared volume, a face drawn twice, a crack between members that
        # meet, a free railing end, a terrace off its datum.
        run: npm run audit:exterior
      - name: Upload exterior closure reports
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        uses: actions/upload-artifact@v4
        with:
          name: exterior-closure
          if-no-files-found: ignore
          retention-days: 14
          path: |
            stage-reports/artifacts/exterior-closure/**
            stage-reports/artifacts/analyzer-v2/marcowki-exterior-closure-evaluation.*
      - name: Upload analyzer-v2 artifacts
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-v2
          if-no-files-found: ignore
          retention-days: 14
          path: stage-reports/artifacts/analyzer-v2/**
      - name: Upload reconstruction diagnostics
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            stage-reports/artifacts/reconstruction/**
            .cache/no-reference/**

  analyzer-image:
    name: Analyzer API / container
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22 (runs the smoke script only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the image
        run: docker build -f apps/analyzer-api/Dockerfile -t buildapp-analyzer:ci .
      - name: Start the container
        run: docker run -d --name analyzer -p 8080:8080 buildapp-analyzer:ci
      - name: Smoke the container over HTTP
        run: node apps/analyzer-api/scripts/smoke.mjs --base http://127.0.0.1:8080
      - name: A real project URL through the container (advisory — depends on a third-party site)
        continue-on-error: true
        run: >-
          node apps/analyzer-api/scripts/smoke.mjs --base http://127.0.0.1:8080
          --analyze "https://www.archon.pl/projekty-domow/projekt-dom-w-marcowkach-ge-m2fa281446a8ca"
          --timeout-s 900 --out analyzer-live
      - name: Container health and log
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        run: |
          docker inspect --format 'health: {{.State.Health.Status}}' analyzer || true
          docker logs analyzer 2>&1 | tail -n 60 || true
      - name: Upload the live run record
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-live-run
          if-no-files-found: ignore
          retention-days: 14
          path: analyzer-live/**

  analyzer-deploy:
    # Deploys the analyzer API to Fly.io when, and only when, the repository
    # has a FLY_API_TOKEN secret (docs/ANALYZER_API.md → Deployment). Without
    # it this job only says so: nothing pretends a service exists.
    name: Analyzer API / deploy
    needs: [core, analyzer-image]
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ANALYZER_API_BASE_URL: ${{ vars.ANALYZER_API_BASE_URL }}
    steps:
      - name: Is a deployment configured?
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "### Analyzer API not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository has no FLY_API_TOKEN secret, so CI does not deploy the analyzer service. APKs from this run have ANALYZER_API_BASE_URL='${ANALYZER_API_BASE_URL}'." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout
        if: env.FLY_API_TOKEN != ''
        uses: actions/checkout@v4
      - name: Node 22
        if: env.FLY_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy . --config apps/analyzer-api/fly.toml --dockerfile apps/analyzer-api/Dockerfile --remote-only
      - name: Smoke the deployment
        if: env.FLY_API_TOKEN != '' && env.ANALYZER_API_BASE_URL != ''
        run: node apps/analyzer-api/scripts/smoke.mjs --base "$ANALYZER_API_BASE_URL"

  browser:
    name: Browser / Playwright
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production browser verification
        run: npm run e2e
      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/web/test-results/**
            stage-reports/artifacts/**/*.png

  android:
    name: Android / APK
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Optional private preview signing identity. These are empty unless the
      # repository defines secrets of the same names, and the Gradle script
      # treats empty as unset: the APKs are then signed with the committed
      # preview key (apps/android/keystore/README.md), which is what gives
      # every CI build the same signature and lets it install over the last.
      BUILDPLAN_PREVIEW_KEYSTORE_BASE64: ${{ secrets.BUILDPLAN_PREVIEW_KEYSTORE_BASE64 }}
      BUILDPLAN_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.BUILDPLAN_PREVIEW_KEYSTORE_PASSWORD }}
      BUILDPLAN_PREVIEW_KEY_ALIAS: ${{ secrets.BUILDPLAN_PREVIEW_KEY_ALIAS }}
      BUILDPLAN_PREVIEW_KEY_PASSWORD: ${{ secrets.BUILDPLAN_PREVIEW_KEY_PASSWORD }}
      # The analyzer service's public address, compiled into BuildConfig. A
      # repository VARIABLE, not a secret: it is a URL, and the APK carries no
      # credential for it. Empty when no service is deployed; the app then
      # says so and lets the owner enter an address.
      ANALYZER_API_BASE_URL: ${{ vars.ANALYZER_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Ensure Android 35 SDK, the NDK and CMake
        # NDK + CMake build the JNI bridge to the embedded Node runtime (BUILDAPP-03Y2)
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Install JS dependencies
        run: npm ci
      - name: Regenerate mobile scene bundles
        run: npm run mobile:export-scenes
      - name: Assert committed mobile bundles are current
        run: git diff --exit-code -- apps/android/app/src/main/assets/scenes
      - name: Android JVM tests
        run: npm run android:test
      - name: Private preview signing key (only when the secret is defined)
        if: env.BUILDPLAN_PREVIEW_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$BUILDPLAN_PREVIEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.keystore"
          echo "BUILDPLAN_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview.keystore" >> "$GITHUB_ENV"
      - name: Assemble preview APKs
        # versionCode = 1000 + GITHUB_RUN_NUMBER and versionName = 0.<run>.0-preview
        # are derived by app/build.gradle.kts from the environment GitHub sets;
        # nothing to pass here. The result is signed with the preview key.
        run: npm run android:assembleDebug
      - name: Verify the signer and record the preview version
        run: |
          apps/android/tools/verify-preview-signature.sh
          {
            echo '### BuildPlan Model Preview APKs'
            echo
            echo 'Signed with the preview key: a phone with an earlier preview build installs this one as an update.'
            echo
            echo '```'
            cat apps/android/app/build/preview-apks/VERSION.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The APK asks for the network and nothing else
        # INTERNET is the one permission the Analyzer adds. The other line
        # AndroidX's core library adds by itself: a signature permission the
        # app defines for its own not-exported broadcast receivers, which
        # grants no access to anything on the phone.
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          for apk in apps/android/app/build/preview-apks/*.apk; do
            perms=$("$AAPT" dump permissions "$apk" | sed -nE "s/^uses-permission: name='([^']+)'.*/\1/p" | sort -u | tr '\n' ' ')
            echo "$(basename "$apk"): $perms"
            [ "$perms" = "android.permission.INTERNET com.buildplan.preview.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION " ] || { echo "::error::unexpected permissions in $apk: $perms"; exit 1; }
          done
          echo "Analyzer service compiled in: '${ANALYZER_API_BASE_URL}'" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: buildplan-model-preview-apks
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/android/app/build/preview-apks/*.apk
            apps/android/app/build/preview-apks/VERSION.txt

  local-analyzer-host:
    # BUILDAPP-03Y2. The analyzer bundle the APK embeds, run on this machine
    # exactly as the phone runs it, under Node 18.20.4 — the version of the
    # runtime inside the APK (nodejs-mobile) — and under Node 22, against the
    # desktop pipeline (runAnalysis from the TypeScript sources).
    name: Local analyzer / Node 18 parity
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARCOWKI_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-marcowkach-ge-m2fa281446a8ca
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Node 18.20.4 (the runtime version inside the APK)
        run: |
          curl -fsSL https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "LOCAL_ANALYZER_NODE18=$RUNNER_TEMP/node-v18.20.4-linux-x64/bin/node" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/node-v18.20.4-linux-x64/bin/node" --version
      - name: Parity, cancel and cleanup under Node 22 and Node 18; architecture gates
        run: npx vitest run apps/local-analyzer tests/architecture/local-analyzer.test.ts
      - name: Fixture parity record (desktop pipeline vs the bundle on Node 18 and 22)
        run: |
          mkdir -p local-analyzer-host
          node apps/local-analyzer/build.mjs --fixture
          npx vite-node apps/local-analyzer/scripts/desktop-hashes.ts -- --out local-analyzer-host/desktop-fixture.json
          node apps/local-analyzer/scripts/run-host.mjs --dir apps/local-analyzer/dist --fixture --node "$LOCAL_ANALYZER_NODE18" --url https://drawings.synthetic-publisher.test/projects/larchfield-lf01 > local-analyzer-host/bundle-node18-fixture.json
          node apps/local-analyzer/scripts/run-host.mjs --dir apps/local-analyzer/dist --fixture --url https://drawings.synthetic-publisher.test/projects/larchfield-lf01 > local-analyzer-host/bundle-node22-fixture.json
          node -e "
            const d = require('./local-analyzer-host/desktop-fixture.json')
            const keys = ['candidateHash','modelHash','sceneContentHash','sceneSha256']
            for (const f of ['bundle-node18-fixture.json','bundle-node22-fixture.json']) {
              const s = JSON.parse(require('fs').readFileSync('local-analyzer-host/' + f, 'utf8')).terminal.summary
              for (const k of keys) if (s[k] !== d[k]) { console.error(f, k, s[k], '!=', d[k]); process.exit(1) }
            }
            console.log('fixture parity: desktop = bundle on Node 18 = bundle on Node 22', keys.map(k => k + ' ' + d[k].slice(0, 12)).join(', '))
          "
      - name: The text adapter's tables are what this ICU generates
        # Android's runtime has no ICU (nodejs-mobile builds --with-intl=none); src/text-tables.ts
        # stands in for it and must be exactly what the desktop's ICU says (about three minutes)
        run: node apps/local-analyzer/scripts/generate-text-tables.mjs --check
      - name: The real Marcówki URL through the bundle on Node 18, with ICU and as on Android without it (advisory — depends on a third-party site)
        continue-on-error: true
        run: |
          node apps/local-analyzer/scripts/run-host.mjs --dir apps/local-analyzer/dist --node "$LOCAL_ANALYZER_NODE18" --url "$MARCOWKI_URL" --events local-analyzer-host/marcowki-node18-events.ndjson > local-analyzer-host/marcowki-node18.json
          node apps/local-analyzer/scripts/run-host.mjs --dir apps/local-analyzer/dist --node "$LOCAL_ANALYZER_NODE18" --no-icu --url "$MARCOWKI_URL" --events local-analyzer-host/marcowki-node18-no-icu-events.ndjson > local-analyzer-host/marcowki-node18-no-icu.json
          node apps/local-analyzer/scripts/compare-runs.mjs --device local-analyzer-host/marcowki-node18-no-icu.json --desktop local-analyzer-host/marcowki-node18.json --md local-analyzer-host/marcowki-no-icu-vs-icu.md
          { echo "### Marcówki on Node 18: without ICU (text adapter) vs with ICU"; echo; cat local-analyzer-host/marcowki-no-icu-vs-icu.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the host parity record
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        uses: actions/upload-artifact@v4
        with:
          name: local-analyzer-host
          if-no-files-found: ignore
          retention-days: 30
          path: local-analyzer-host/**

  local-analyzer-device:
    # BUILDAPP-03Y2. The APK with the embedded analyzer: its exact size against
    # the same commit built without it, and the analyzer running ON Android —
    # an x86_64 emulator with KVM, the real nodejs-mobile runtime, the
    # production analyzer.mjs from the app's assets — held to the desktop
    # pipeline's hashes, cancelled while downloading and while computing, and
    # (advisory) run on the real Marcówki URL and compared with the desktop.
    name: Local analyzer / APK size + emulator
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the before screenshots read an earlier run's APK artifact
      actions: read
    timeout-minutes: 120
    env:
      MARCOWKI_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-marcowkach-ge-m2fa281446a8ca
      SECOND_HOUSE_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-rarytasach-5-g2e-m84f2903cb8e14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Android 35 SDK, the NDK and CMake
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Install JS dependencies
        run: npm ci
      - name: APKs WITHOUT the local analyzer (the size baseline; clean build)
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon assembleDebug -PlocalAnalyzer=false
          mkdir -p "$RUNNER_TEMP/apk-without"
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/apk-without/"
      - name: APKs WITH the local analyzer, and the instrumentation test APK (clean build)
        working-directory: apps/android
        run: ./gradlew --no-daemon clean assembleDebug assembleDebugAndroidTest
      - name: APK size report (measured from the files)
        run: |
          mkdir -p local-analyzer-device
          for abi in arm64-v8a x86_64; do
            node apps/android/tools/apk-size-report.mjs \
              --local "apps/android/app/build/outputs/apk/debug/app-$abi-debug.apk" \
              --without "$RUNNER_TEMP/apk-without/app-$abi-debug.apk" \
              --runtime-json apps/android/third_party/nodejs-mobile/runtime.json \
              --meta apps/android/app/build/local-analyzer/meta.json \
              --out "local-analyzer-device/size-$abi.json" --md "local-analyzer-device/size-$abi.md"
          done
          {
            echo "### Local analyzer — APK size, arm64-v8a"; echo; cat local-analyzer-device/size-arm64-v8a.md; echo
            echo "### Local analyzer — APK size, x86_64 (the emulator's)"; echo; cat local-analyzer-device/size-x86_64.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The desktop pipeline's hashes for the device fixture
        run: npx vite-node apps/local-analyzer/scripts/desktop-hashes.ts -- --out local-analyzer-device/desktop-fixture.json
      - name: The real Marcówki URL on the desktop, through the exact bundle the APK ships (advisory)
        continue-on-error: true
        run: |
          # the bundle is taken out of the built APK itself: these are the bytes the phone runs
          unzip -o -q apps/android/app/build/outputs/apk/debug/app-x86_64-debug.apk 'assets/local-analyzer/*' -d "$RUNNER_TEMP/apk-bundle"
          node apps/local-analyzer/scripts/run-host.mjs --dir "$RUNNER_TEMP/apk-bundle/assets/local-analyzer" \
            --url "$MARCOWKI_URL" --events local-analyzer-device/desktop-live-events.ndjson > local-analyzer-device/desktop-live.json
      - name: The previous preview APK, for the before screenshots (INTEGRATION-003B; advisory)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          # CI run 51 of integration/unified-buildplan-presentation-v1 (INTEGRATION-003A), the build before the product shell
          name: buildplan-model-preview-apks
          run-id: 36314929333
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apk-before
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The local analyzer on Android (emulator x86_64, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DESKTOP_FIXTURE: local-analyzer-device/desktop-fixture.json
          LIVE_URL: ${{ env.MARCOWKI_URL }}
          # BUILDAPP-03Y2G: the second regression project, on the device too (advisory, like the first)
          SECOND_LIVE_URL: ${{ env.SECOND_HOUSE_URL }}
          LIVE_TIMEOUT_MINUTES: "40"
          OUT: local-analyzer-device/device
        with:
          api-level: 34
          target: default
          arch: x86_64
          cores: 4
          ram-size: 6144M
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          # the device gate decides the job; the product-shell screenshots after it are evidence only
          script: bash apps/android/tools/run-device-tests.sh; status=$?; OUT=local-analyzer-device/shell-screens BEFORE_APK_DIR="$RUNNER_TEMP/apk-before" bash apps/android/tools/capture-shell-screens.sh; exit $status
      - name: What the runs on the emulator cost
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        run: |
          node apps/local-analyzer/scripts/device-summary.mjs local-analyzer-device/device/local-analyzer-reports --md local-analyzer-device/device-summary.md || true
          {
            echo "### Local analyzer on the emulator (CI/emulator measured — not a phone)"; echo
            cat local-analyzer-device/device/device.txt 2>/dev/null | sed 's/^/    /'; echo
            cat local-analyzer-device/device-summary.md 2>/dev/null
            echo; echo "Live URL on the device: $(cat local-analyzer-device/device/live-status.txt 2>/dev/null || echo LIVE_ANDROID_ANALYSIS_NOT_RUN)"
            echo; echo "Second house on the device: $(cat local-analyzer-device/device/live-second-house-status.txt 2>/dev/null || echo LIVE_ANDROID_ANALYSIS_NOT_RUN)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Device vs desktop on the real URL (advisory)
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        continue-on-error: true
        run: |
          node apps/local-analyzer/scripts/compare-runs.mjs \
            --device local-analyzer-device/device/local-analyzer-reports/live.json \
            --desktop local-analyzer-device/desktop-live.json \
            --md local-analyzer-device/live-comparison.md
          { echo "### Marcówki: device vs desktop"; echo; cat local-analyzer-device/live-comparison.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the device and size record
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        uses: actions/upload-artifact@v4
        with:
          name: local-analyzer-device
          if-no-files-found: ignore
          retention-days: 30
          path: local-analyzer-device/**

  android-3d-gate:
    # INTEGRATION-003C. The 3D place reached the owner's way — cold start on
    # Dom, `3D` in the navigation bar, back, `3D` again — and directly, with
    # the renderer's own counters and the render surface's pixels held
    # against the screen's (ModelEntryDeviceTest), at font scale 1.0 and 1.3.
    # A job of its own, bounded by run-3d-gate.sh's timeouts. The emulator runs
    # ANGLE on SwiftShader Vulkan (swangle_indirect, OpenGL ES 3.1): with the
    # default gfxstream SwiftShader GLES 3.0 translator (swiftshader_indirect,
    # and `guest`, which falls back to it on API 34) the emulator itself went
    # away right after Filament's first frame (runs 56 and 57).
    name: Android / 3D entry gate
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GPU: swangle_indirect
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Android 35 SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: The app and the instrumentation APK (without the embedded analyzer; the 3D place does not use it)
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -PlocalAnalyzer=false
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The 3D gate on the emulator (x86_64, API 34, ANGLE on SwiftShader)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 4G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: OUT=model-entry bash apps/android/tools/run-3d-gate.sh
      - name: Summary
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        run: |
          {
            echo "### 3D entry gate — emulator GPU $GPU"; echo
            echo "status: $(cat model-entry/status.txt 2>/dev/null || echo NOT_RUN)"; echo
            echo '```'; cat model-entry/device.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the 3D gate evidence
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        uses: actions/upload-artifact@v4
        with:
          name: model-entry
          if-no-files-found: ignore
          retention-days: 30
          path: model-entry/**

  android-ui-evidence:
    # INTEGRATION-003C / 004A. The house-first product on the emulator the
    # owner's way, and the reference projects (Marcówki, Rarytasy, Kosaćce,
    # the alternate Marcówki publisher) analysed on the phone and carried
    # through the house, progress and history (.github/workflows/ui-evidence.yml).
    uses: ./.github/workflows/ui-evidence.yml
    with:
      # Every push and full dispatch runs the slices; a UI-only dispatch may leave them out.
      slices: ${{ github.event_name != 'workflow_dispatch' || inputs.ui_slices }}

  second-house-generalization:
    # BUILDAPP-03Y2G. A second real project beside Marcówki, kept as a
    # regression project. The analyzer is gated here, not the publisher: the
    # live URL must complete through the production pipeline, its own sealed
    # evidence must replay offline to the same hashes, the evidence the
    # analyzer read before this stage must still be refused, by name, and the
    # bundle the APK embeds must reach the same model on Node 18 without ICU,
    # as on Android. When the publisher cannot be reached, the run is recorded
    # and warned about instead of failing: that is not an analyzer failure.
    name: Second house / generalization
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SECOND_HOUSE_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-rarytasach-5-g2e-m84f2903cb8e14
      SEALED: stage-reports/artifacts/rarytasy-generalization
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Node 18.20.4 (the runtime version inside the APK)
        run: |
          curl -fsSL https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "LOCAL_ANALYZER_NODE18=$RUNNER_TEMP/node-v18.20.4-linux-x64/bin/node" >> "$GITHUB_ENV"
      - name: The live URL through the production pipeline (must complete)
        run: |
          mkdir -p second-house
          npm run -s analysis:second-house -- --url "$SECOND_HOUSE_URL" --out second-house/live --cache .cache/second-house-bytes --expect COMPLETED --tolerate-source-outage | tee second-house/live.log
      - name: Its sealed evidence, replayed offline, gives the same candidate, model and scene
        run: |
          if [ ! -f second-house/live/result-summary.json ]; then echo "::warning::no completed live run to replay"; exit 0; fi
          OFFLINE=1 npm run -s analysis:second-house -- --package second-house/live/source-package.json --graph second-house/live/observation-graph.json \
            --out second-house/replay --cache .cache/second-house-bytes --expect COMPLETED --same-as second-house/live/result-summary.json
      - name: The garage is a gable, not a flat slab (INTEGRATION-003B regression, evaluation only)
        run: |
          if [ ! -f second-house/live/model.json ]; then echo "::warning::no completed live run to judge"; exit 0; fi
          BUILDAPP_SECOND_HOUSE_DIR=second-house/live npx vitest run tests/benchmark/second-house-roof.test.ts
      - name: The pre-fix evidence through today's solver is refused by name, not by ANALYSIS_FAILED
        run: |
          if [ ! -d .cache/second-house-bytes ]; then echo "::warning::no plan images fetched; nothing to replay"; exit 0; fi
          npm run -s analysis:second-house -- --package "$SEALED/pre-fix/source-package.json" --graph "$SEALED/pre-fix/observation-graph.json" \
            --metrics "$SEALED/pre-fix/metric-evidence.json" --out second-house/pre-fix --cache .cache/second-house-bytes --expect FAILED
          node -e "
            const f = require('./second-house/pre-fix/failure.json')
            if (f.code !== 'RECONSTRUCTION_FAILED' || f.reasonCode !== 'PLAN_LAYOUT_REJECTED') { console.error('expected RECONSTRUCTION_FAILED / PLAN_LAYOUT_REJECTED, got', f.code, f.reasonCode); process.exit(1) }
            console.log('pre-fix evidence:', f.code, '/', f.reasonCode, 'in', f.stage, '/', f.substage)
          "
      - name: The committed post-fix evidence replays to the committed hashes (advisory — needs the publisher's images, which are not committed)
        continue-on-error: true
        run: |
          # INTEGRATION-003B re-read this evidence (attached roof form, side-view orientation): its expected result is sealed beside the stage.
          OFFLINE=1 npm run -s analysis:second-house -- --package "$SEALED/post-fix/source-package.json" --graph "$SEALED/post-fix/observation-graph.json" \
            --out second-house/committed-replay --cache .cache/second-house-bytes --expect COMPLETED --same-as stage-reports/artifacts/integration-003b/rarytasy/result-summary-after.json
          BUILDAPP_SECOND_HOUSE_DIR=second-house/committed-replay npx vitest run tests/benchmark/second-house-roof.test.ts
      - name: The bundle the APK embeds, on Node 18 without ICU as on Android, reaches the same model and scene
        run: |
          node apps/local-analyzer/build.mjs
          node apps/local-analyzer/scripts/run-host.mjs --dir apps/local-analyzer/dist --node "$LOCAL_ANALYZER_NODE18" --no-icu --url "$SECOND_HOUSE_URL" \
            --events second-house/node18-no-icu-events.ndjson > second-house/node18-no-icu.json || true
          node -e "
            const fs = require('fs')
            const run = JSON.parse(fs.readFileSync('second-house/node18-no-icu.json', 'utf8')).terminal ?? {}
            if (run.type === 'failed' && run.code === 'SOURCE_UNREACHABLE') { console.log('::warning::the publisher could not be reached from the Node 18 run'); process.exit(0) }
            if (run.type !== 'done') { console.error('the bundle on Node 18 did not complete:', JSON.stringify(run).slice(0, 600)); process.exit(1) }
            if (!fs.existsSync('second-house/live/result-summary.json')) { console.log('::warning::no desktop run to compare with'); process.exit(0) }
            const desktop = require('./second-house/live/result-summary.json')
            // two fetches of one page seal different packages (the page itself changes), so the
            // candidate, which cites its package, differs; the model and scene must not
            const keys = ['modelHash', 'sceneContentHash', 'sceneSha256']
            const differ = keys.filter((k) => run.summary[k] !== desktop[k])
            if (differ.length) { for (const k of differ) console.error(k, run.summary[k], '!=', desktop[k]); process.exit(1) }
            console.log('desktop = bundle on Node 18 (no ICU):', keys.map((k) => k + ' ' + desktop[k].slice(0, 12)).join(', '), '; peak RSS', run.metrics?.memory?.peakRssBytes, 'bytes,', run.metrics?.elapsedMs, 'ms')
          "
      - name: Summary
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        run: |
          {
            echo "### Second house (BUILDAPP-03Y2G)"; echo
            echo '```'; tail -n 12 second-house/live.log 2>/dev/null; echo '```'
            for f in second-house/live/failure.json second-house/pre-fix/failure.json; do
              [ -f "$f" ] && { echo "$f:"; echo '```'; node -e "const f=require('./$f'); console.log(f.code, '/', f.reasonCode, '—', f.stage, '/', f.substage, '—', f.message)"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the second-house record
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
        uses: actions/upload-artifact@v4
        with:
          name: second-house-generalization
          if-no-files-found: ignore
          retention-days: 30
          path: |
            second-house/**
            !second-house/**/observation-graph.json

  third-house-kosacce:
    # INTEGRATION-004A. A third real project, Kosaćce, whose partition walls
    # used to reach the model as WALLS_OVERLAP at command 52. The gate is the
    # generic wall-topology planner, not the house: the sealed evidence
    # (source package, observation graph, metric evidence read before this
    # stage) must go through today's solver to the sealed model and scene
    # hashes — a hard gate whenever the publisher's plan images can be fetched
    # (they are not committed) — and the live URL is advisory, recorded and
    # compared, never a red job for a publisher outage. The validator stays
    # strict: the negative topology tests run in `npm test`.
    name: Third house / Kosaćce topology
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      THIRD_HOUSE_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-kosaccach-46-mf6628752fa61f
      SEALED: stage-reports/artifacts/integration-004a/kosacce
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: The publisher's drawings (fetched into the cache; a live run is advisory)
        continue-on-error: true
        run: |
          mkdir -p third-house
          npm run -s analysis:second-house -- --url "$THIRD_HOUSE_URL" --out third-house/live --cache .cache/third-house-bytes --expect COMPLETED --tolerate-source-outage | tee third-house/live.log
      - name: The sealed evidence through today's solver reaches the sealed model and scene (no WALLS_OVERLAP)
        run: |
          if [ ! -d .cache/third-house-bytes ]; then echo "::warning::no plan images fetched; the sealed replay needs them and is skipped"; exit 0; fi
          OFFLINE=1 npm run -s analysis:second-house -- --package "$SEALED/source-package.json" --graph "$SEALED/observation-graph.json" \
            --metrics "$SEALED/metric-evidence.json" --out third-house/sealed-replay --cache .cache/third-house-bytes --expect COMPLETED --same-as "$SEALED/result-summary.json"
      - name: The live run, when it completed, agrees with the sealed model and scene (advisory — the page may change)
        continue-on-error: true
        run: |
          if [ ! -f third-house/live/result-summary.json ]; then echo "::warning::no completed live run to compare"; exit 0; fi
          node -e "
            const live = require('./third-house/live/result-summary.json'), sealed = require('./$SEALED/result-summary.json')
            const keys = ['modelHash', 'sceneContentHash', 'sceneSha256']
            const differ = keys.filter((k) => live[k] !== sealed[k])
            if (differ.length) { for (const k of differ) console.error('::warning::' + k, live[k], '!=', sealed[k]); process.exit(1) }
            console.log('live = sealed:', keys.map((k) => k + ' ' + sealed[k].slice(0, 12)).join(', '))
          "
      - name: Summary
        if: always()
        run: |
          {
            echo "### Third house — Kosaćce (INTEGRATION-004A)"; echo
            echo '```'; tail -n 8 third-house/live.log 2>/dev/null; echo '```'
            if [ -f third-house/sealed-replay/result-summary.json ]; then echo "sealed replay: $(node -e "const r=require('./third-house/sealed-replay/result-summary.json'); console.log(r.outcome, r.modelHash.slice(0,16))")"; fi
            if [ -f third-house/sealed-replay/failure.json ]; then echo "sealed replay:"; echo '```'; node -e "const f=require('./third-house/sealed-replay/failure.json'); console.log(f.code, '/', f.reasonCode, '—', f.message)"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the third-house record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: third-house-kosacce
          if-no-files-found: ignore
          retention-days: 30
          path: |
            third-house/**
            !third-house/**/observation-graph.json

  analyzer-generalization:
    # BUILDPLAN-ANALYZER-005A. The analyzer reads source evidence, never a
    # development house, and gives the same building however the page was
    # reached or enumerated.
    # - Purity: a registry derived from every sealed package in stage-reports.
    # - Metamorphic URLs: tracking keys, order, fragment, trailing slash,
    #   canonical link and redirect.
    # - Order and determinism.
    # - The known set the resolver had to answer. These are the OWNER's phone
    #   case (Kosaćce with only its area-table plan copy) and Rarytasy e-OZE
    #   (every copy, and the area copy alone). Their sealed evidence goes
    #   through today's solver and is judged by rule, not by a pinned hash
    #   (post-Council): the house's own body count, a plan resolved within 6 %
    #   of a published figure the resolver was free to use, and a refusal only
    #   where the row allows one, by name (scripts/known-row.mjs).
    #   It is a hard gate whenever the publisher's images can be fetched;
    #   they are never committed. Only a publisher that cannot be reached at
    #   all is a warning; any other failure to fetch fails the job.
    # Image-transform robustness is measured and reported, not gated
    # (Council decision).
    name: Analyzer / generalization
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BEFORE: stage-reports/artifacts/analyzer-005a/before
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Purity, source invariance, harmless order and determinism
        run: npx vitest run tests/architecture/generalization.test.ts packages/source-package/test/logical-identity.test.ts packages/analysis-service/test/generic-source.test.ts packages/source-metrics/test/extract.test.ts packages/analysis-service/test/service.test.ts
      - name: The publisher's drawings for the known set (fetched, never committed)
        run: |
          mkdir -p .cache
          for n in kosacce-clean rarytasy-eoze; do
            url=$(node -e "console.log(require('./$BEFORE/$n/source-package.json').canonicalUrl)")
            if out=$(npm run -s source:acquire -- "$url" --cache ".cache/known-$n" --quiet 2>&1); then
              echo ok > ".cache/known-$n.status"
            elif echo "$out" | grep -q "the page could not be fetched"; then
              echo unreachable > ".cache/known-$n.status"
              echo "::warning::$n: the publisher's page could not be reached; this row is not judged"
            else
              echo failed > ".cache/known-$n.status"
              echo "$out" | tail -n 5
            fi
          done
      - name: The known set through today's solver, judged by rule
        run: |
          set -euo pipefail
          mkdir -p known
          # ground-storey plan copies other than the area table: withheld for the "area copy alone" rows
          dimensioned() { node -e "const g=require('./$BEFORE/$1/observation-graph.json'); console.log(g.coordinateFrames.filter((f)=>f.roles.projection==='ORTHOGRAPHIC_PLAN'&&f.roles.document==='FLOOR_PLAN'&&['GROUND','UNKNOWN'].includes(f.roles.storey)&&f.roles.annotation==='DIMENSIONED').map((f)=>f.id).join(','))"; }
          row() { # row <name> <sealed> <bodies> <must-complete|may-refuse> [drop]
            status=$(cat ".cache/known-$2.status" 2>/dev/null || echo missing)
            if [ "$status" = unreachable ]; then echo "::warning::$1: not judged, the publisher could not be reached"; return 0; fi
            if [ "$status" != ok ]; then echo "::error::$1: the publisher's drawings were not fetched ($status)"; return 1; fi
            OFFLINE=1 npm run -s analysis:second-house -- --package "$BEFORE/$2/source-package.json" --graph "$BEFORE/$2/observation-graph.json" \
              --metrics "$BEFORE/$2/metric-evidence.json" --cache ".cache/known-$2" --out "known/$1" ${5:+--drop-frames "$5"} > "known/$1.log" 2>&1
            tail -n 3 "known/$1.log"
            node packages/analysis-service/scripts/known-row.mjs "known/$1" "$3" "$4"
          }
          # The area copy alone reads Kosaćce two ways and only the published figure tells them apart, after it
          # refused the first one: named, not built. e-OZE's first reading stops on the drawing: it must complete.
          row kosacce-area-copy-alone kosacce-clean 3 may-refuse "$(dimensioned kosacce-clean)"
          row eoze-every-copy rarytasy-eoze 1 must-complete
          row eoze-area-copy-alone rarytasy-eoze 1 must-complete "$(dimensioned rarytasy-eoze)"
      - name: Upload the known-set record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-generalization
          if-no-files-found: ignore
          retention-days: 30
          path: |
            known/**
            !known/**/observation-graph.json

  plan-resolver:
    # BUILDPLAN-ANALYZER-005A. The bounded plan resolver.
    # - Its decomposition families: walled-first tiling, wall-ink extent,
    #   lattice scales, outer faces, and pocket mouths shut.
    # - Lexicographic ranking and strict acceptance, named ties, determinism.
    # - The plan shape families through the whole pipeline: a row may move
    #   up and never down, and a silently smaller building is never allowed
    #   unless listed.
    # - The canonical model's hard invariants (WALLS_OVERLAP and the rest)
    #   stay strict.
    name: Analyzer / plan resolver
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Resolver, decomposition families and shape families
        run: npx vitest run packages/reconstruction/test/plan-resolution.test.ts packages/reconstruction/test/shape-families.test.ts packages/reconstruction/test/structural-mutations.test.ts
      - name: Hard invariants stay hard (negative tests)
        run: npx vitest run packages/model/test/topology.test.ts packages/reconstruction/test/wall-topology.test.ts tests/architecture/topology.test.ts

  analyzer-progress:
    # BUILDPLAN-ANALYZER-005A. What the run says while it works.
    # - The overall percent only moves forward, and never reads 100 % before
    #   the run is done.
    # - Real counters: which frame of how many, rings, token groups.
    # - A heartbeat with no holes.
    # - Telemetry is write-only: the same bytes with and without it.
    # - A cancel lands at the next loop boundary: inside the metric pass,
    #   inside registration, and in the phone's program while it computes.
    # - Warnings carry a severity.
    # The phone's own liveness verdict (LivenessTrackerTest) runs in the
    # Android job's JVM tests.
    name: Analyzer / progress
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Telemetry, progress, cancellation and severities
        run: npx vitest run packages/analysis-service/test/telemetry.test.ts packages/analysis-service/test/warnings.test.ts packages/analysis-service/test/service.test.ts apps/local-analyzer/test/program.test.ts apps/analyzer-api/test/android-contract.test.ts

  analyzer-dimension-evidence:
    # BUILDPLAN-ANALYZER-005B. Metric truth from the drawing's own dimensions.
    # - dimension-orientation: every label read every way up (0, 90, 180 and
    #   270 degrees, page rotations), the raw readings kept beside the page
    #   vote's and never instead of it, leading-zero shadows of upside-down
    #   labels, mirrored patterns.
    # - scale-independence: a correction made under a scale never witnesses
    #   that scale; independent witness groups; one ink, one witness;
    #   determinism.
    # - dimension-chain: totals and segments, nesting, missing and
    #   conflicting labels recorded rather than forced.
    # - extent: the longest interior chain is never the building; the wall
    #   witness; an outer chain's ticks; no outer chain at all.
    # - source parity: the desktop and the phone's runtime make the same
    #   SourcePackage from the same bytes.
    # - the production hard-code guard, with the development houses' printed
    #   overall dimensions.
    name: Analyzer / dimension evidence
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Dimension orientation
        run: npx vitest run packages/source-metrics/test/orientation-metamorphic.test.ts packages/source-metrics/test/ocr.test.ts
      - name: Scale independence
        run: npx vitest run packages/source-metrics/test/metric-solution.test.ts packages/source-metrics/test/registration.test.ts packages/source-metrics/test/scale-plausibility.test.ts
      - name: Dimension chains
        run: npx vitest run packages/source-metrics/test/chains.test.ts packages/source-metrics/test/extract.test.ts
      - name: Plan extent
        run: npx vitest run packages/reconstruction/test/plan-extent.test.ts packages/reconstruction/test/plan-decomposition.test.ts packages/reconstruction/test/plan-resolution.test.ts
      - name: Source parity (desktop and the phone's runtime, same bytes)
        run: npx vitest run apps/local-analyzer/test/source-parity.test.ts apps/local-analyzer/test/text.test.ts
      - name: Production hard-code guard
        run: npx vitest run tests/architecture/generalization.test.ts

  analyzer-opening-aware-envelope:
    # BUILDPLAN-ANALYZER-005C. The building's outline from wall-thick ink and
    # classified gaps, attached bodies by their relations, and the generic
    # source reader on page structures it had not met.
    # - boundary-envelope: 15 synthetic shapes, the metamorphic drawings, the
    #   wide-gap and terrace negatives, the 1.0 m wing and the 2.0 m line.
    # - attached-bodies: wing, open-mouthed garage (and the reading that shuts
    #   it), terrace, planter, detached shed; the two jamb policies and
    #   BOUNDARY_RESOLUTION_INCONCLUSIVE; the shape families unchanged.
    # - generic source: block facts, tooltips, grids, cards, superscript units,
    #   linked documents (hashed, never parsed), captions, views; the
    #   hard-code guard with generic publishers' names.
    # - metric regression: 005B's dimension gates, unchanged.
    # - Aster VIII: the cross-publisher probe acquired live; a publisher that
    #   cannot be reached is a warning, anything else is judged.
    name: Analyzer / opening-aware envelope
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Boundary envelope
        run: npx vitest run packages/reconstruction/test/boundary-envelope.test.ts packages/reconstruction/test/wide-openings.test.ts packages/reconstruction/test/plan-decomposition.test.ts
      - name: Attached bodies
        run: npx vitest run packages/reconstruction/test/attached-bodies.test.ts packages/reconstruction/test/shape-families.test.ts packages/reconstruction/test/failure-codes.test.ts
      - name: Generic source
        run: npx vitest run packages/source-package/test/generic-structures.test.ts packages/source-package/test/generic.test.ts tests/architecture/generalization.test.ts
      - name: Metric regression (005B gates, unchanged)
        run: npx vitest run packages/source-metrics/test/orientation-metamorphic.test.ts packages/source-metrics/test/metric-solution.test.ts packages/source-metrics/test/registration.test.ts packages/source-metrics/test/scale-plausibility.test.ts packages/source-metrics/test/chains.test.ts packages/reconstruction/test/plan-extent.test.ts
      - name: Aster VIII, acquired live (cross-publisher probe)
        run: |
          mkdir -p aster
          if npm run -s source:acquire -- "https://www.dobredomy.pl/projekt/asterVIII/" --out aster/source-package.json --cache .cache/aster > aster/acquire.log 2>&1; then
            node -e "
              const p = require('./aster/source-package.json')
              const keys = new Set(p.publishedFacts.map((f) => f.key))
              const need = ['usable_area', 'footprint_area', 'roof_pitch', 'building_height']
              const missing = need.filter((k) => !keys.has(k))
              if (missing.length) { console.log('::error::Aster: the generic reader missed ' + missing.join(', ')); process.exit(1) }
              const outline = (p.documents ?? []).filter((d) => d.kind === 'OUTLINE')
              if (outline.length === 0) { console.log('::error::Aster: the 1:500 outline is not recorded among the documents'); process.exit(1) }
              if (p.assets.some((a) => a.variants.some((v) => /\\.(pdf|dwg|dxf)(\\?|$)/i.test(v.url)))) { console.log('::error::Aster: a document became an image asset'); process.exit(1) }
              console.log('Aster: ' + p.publishedFacts.length + ' facts, ' + (p.documents ?? []).length + ' documents (' + outline.length + ' outline), schema ' + p.schemaVersion)
            "
          elif grep -q "the page could not be fetched" aster/acquire.log; then
            echo "::warning::Aster: the publisher could not be reached; the live probe is not judged"
          else
            tail -n 5 aster/acquire.log; exit 1
          fi

  analyzer-development-houses:
    # BUILDPLAN-ANALYZER-005B/005C. All eleven development houses through today's
    # analyzer. Only the source package is sealed (stage-reports/artifacts/
    # analyzer-005b/dev); observations, metric evidence and the model are
    # re-extracted from the publisher's drawings, which are fetched here and
    # never committed. Each row is judged by the rule it must meet
    # (scripts/dev-row.mjs); Marcówki, Kosaćce and G2E, whose models did not
    # move, are pinned, and the tracked Kosaćce link to the clean one's model; a house
    # whose metric truth is weak must carry its LIMITING warning; the alternate
    # page must stop with the typed metric reason. Only a publisher that cannot
    # be reached at all is a warning.
    name: Analyzer / development house (${{ matrix.house }})
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - house: marcowki
            expect: pass
            model: 6152770f43f4970a704f5c2be75a9a8f04fe9cb60c71a99533323b2b5fafd64f
          - house: kosacce-clean
            expect: pass
            model: 5b5ffcf1afcd2511023cdc671fd7069d916ab2e92a51e74e6430e7154d27a11f
          - house: kosacce-tracked
            expect: pass
            model: 5b5ffcf1afcd2511023cdc671fd7069d916ab2e92a51e74e6430e7154d27a11f
          - house: rarytasy-g2e
            expect: "footprint:2"
            model: 8fa4a25bcd587248c91ca3510e1f440cfd7043f096d74a820f9104d8e4f91ce8
            limits: METRIC_SCALE_WEAK
          - house: rarytasy-eoze
            expect: pass
          - house: alt-marcowki
            expect: "refuse:METRIC_RESOLUTION_INCONCLUSIVE"
          - house: dom-w-jablonkach
            expect: pass
            limits: METRIC_SCALE_WEAK
          # 005C: the three envelope failures, now built; the cross-publisher probe stops by name
          - house: willa-miranda
            expect: pass
          - house: dom-w-zurawkach
            pkg: stage-reports/artifacts/analyzer-005b/holdout/h1-dom-w-zurawkach/source-package.json
            expect: "footprint:3"
          - house: dom-w-modrzykach
            pkg: stage-reports/artifacts/analyzer-005b/holdout/h2-dom-w-modrzykach/source-package.json
            expect: pass
          - house: aster-viii
            pkg: stage-reports/artifacts/analyzer-005c/aster-viii/source-package.json
            expect: "refuse:METRIC_RESOLUTION_INCONCLUSIVE"
    env:
      DEV: stage-reports/artifacts/analyzer-005b/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: The publisher's drawings (fetched, never committed)
        id: fetch
        run: |
          url=$(node -e "console.log(require('./${{ matrix.pkg || format('{0}/{1}/source-package.json', env.DEV, matrix.house) }}').canonicalUrl)")
          if out=$(npm run -s source:acquire -- "$url" --cache .cache/dev --quiet 2>&1); then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "the page could not be fetched"; then
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.house }}: the publisher's page could not be reached; this row is not judged"
          else
            echo "$out" | tail -n 5
            exit 1
          fi
      - name: Today's analyzer on the sealed package, judged by its row
        if: steps.fetch.outputs.status == 'ok'
        run: |
          mkdir -p dev
          OFFLINE=1 npm run -s analysis:second-house -- --package "${{ matrix.pkg || format('{0}/{1}/source-package.json', env.DEV, matrix.house) }}" --cache .cache/dev --out "dev/${{ matrix.house }}" > "dev/${{ matrix.house }}.log" 2>&1 || true
          tail -n 4 "dev/${{ matrix.house }}.log"
          node packages/analysis-service/scripts/dev-row.mjs "dev/${{ matrix.house }}" "${{ matrix.expect }}" ${{ matrix.model && format('--same-model {0}', matrix.model) || '' }} ${{ matrix.limits && format('--limits {0}', matrix.limits) || '' }}
      - name: Upload the development-house record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-house-${{ matrix.house }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            dev/**
            !dev/**/observation-graph.json
            !dev/**/plan-diagnostics/*.png

  architectural-assemblies:
    # BUILDAPP-03G. The architectural language as a review record: the
    # capability, primitive, assembly and relationship registries; the
    # seventeen synthetic diversity fixtures through validation, DSL replay,
    # round trip, compile and the closure audit; the hypothesis pipeline
    # demonstrations (synthetic evidence only); the roof graph (JSON + SVG) and
    # assembly graph of every fixture, of sealed Marcówki auto v3 and of the
    # second house's live model from the job before. Fails when a fixture or a
    # demonstration fails. The second house is optional input: a publisher
    # outage there leaves its graphs out with a warning, not a red job.
    name: Architecture / assemblies
    needs: second-house-generalization
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: The second house's live model (from the second-house job)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: second-house-generalization
          path: second-house
      - name: Registries, fixtures, demonstrations, roof and assembly graphs, regressions
        run: npm run -s architecture:artifacts -- --out architectural-assemblies --rarytasy second-house/live/model.json
      - name: Summary
        if: always()
        run: |
          {
            echo "### Architectural assemblies (BUILDAPP-03G)"; echo
            cat architectural-assemblies/README.md 2>/dev/null; echo
            cat architectural-assemblies/regression-summary.md 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the architectural-assemblies record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architectural-assemblies
          if-no-files-found: error
          retention-days: 30
          path: architectural-assemblies/**

  preview-release:
    # BUILDAPP-03Y2G: one direct, stable download link for the owner's phone —
    # a GitHub prerelease `preview-latest` whose asset is the arm64 APK itself,
    # BuildPlan-Preview-arm64.apk, not a zip. Re-created on every push to the
    # development branch or main, from the APK the Android job built and
    # verified (same preview signing key, versionCode 1000 + run number, so a
    # phone installs each as an update of the last).
    name: Android / direct APK (preview-latest)
    needs: android
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/buildapp-buildworld-v1-7y6yqh')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The APKs the Android job built
        uses: actions/download-artifact@v4
        with:
          name: buildplan-model-preview-apks
          path: apks
      - name: Publish BuildPlan-Preview-arm64.apk to the preview-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src="apks/BuildPlan-Model-Preview-arm64-v8a-debug.apk"
          [ -f "$src" ] || { echo "::error::no arm64 APK in the Android job's artifact"; ls -la apks; exit 1; }
          cp "$src" BuildPlan-Preview-arm64.apk
          sha=$(sha256sum BuildPlan-Preview-arm64.apk | cut -d' ' -f1)
          {
            echo "BuildPlan Model Preview — arm64 (the owner's phone)."
            echo
            echo "Direct download: https://github.com/${GH_REPO}/releases/download/preview-latest/BuildPlan-Preview-arm64.apk"
            echo
            echo "Built by run ${GITHUB_RUN_NUMBER} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}."
            echo "SHA-256 ${sha}"
            echo
            echo '```'; cat apks/VERSION.txt; echo '```'
            echo
            echo "Signed with the preview key: it installs over any earlier preview build."
          } > notes.md
          gh release delete preview-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create preview-latest BuildPlan-Preview-arm64.apk apks/VERSION.txt \
            --prerelease --target "$GITHUB_SHA" --title "BuildPlan Preview (latest, arm64)" --notes-file notes.md
          url="https://github.com/${GH_REPO}/releases/download/preview-latest/BuildPlan-Preview-arm64.apk"
          echo "### Direct APK" >> "$GITHUB_STEP_SUMMARY"
          echo "$url (SHA-256 $sha)" >> "$GITHUB_STEP_SUMMARY"

  owner-preview-release:
    # The OWNER's test build of a manually dispatched run, as one direct link:
    # the prerelease `owner-preview-latest` whose only asset is the arm64-v8a
    # debug APK itself, BuildPlan-owner-preview.apk, not a zip. It is apart
    # from `preview-latest` (push builds), which this job never touches, and
    # it never publishes the x86_64 APK. The release is created on the first
    # dispatch; every later dispatch replaces the asset in place and rewrites
    # the notes. The tag is a fixed anchor and is not moved: the notes name
    # the commit the APK was built from. The Android job's artifacts stay as
    # they are, for diagnostics.
    name: Android / OWNER direct APK (owner-preview-latest)
    # INTEGRATION-003C: never publish to the owner an APK whose 3D place was
    # not seen to draw the house on the emulator, or whose product journey
    # and screenshots did not pass the UI evidence gate.
    needs: [android, android-3d-gate, android-ui-evidence, third-house-kosacce, analyzer-generalization, plan-resolver, analyzer-progress]
    if: github.event_name == 'workflow_dispatch' && inputs.owner_apk && !inputs.only_ui_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The APKs the Android job built
        uses: actions/download-artifact@v4
        with:
          name: buildplan-model-preview-apks
          path: apks
      - name: Publish BuildPlan-owner-preview.apk to the owner-preview-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: owner-preview-latest
          ASSET: BuildPlan-owner-preview.apk
        run: |
          set -euo pipefail
          # app-arm64-v8a-debug.apk under its delivery name (the previewApks
          # task in apps/android/app/build.gradle.kts copies and renames it).
          src="apks/BuildPlan-Model-Preview-arm64-v8a-debug.apk"
          [ -f "$src" ] || { echo "::error::no arm64 APK in the Android job's artifact"; ls -la apks; exit 1; }
          cp "$src" "$ASSET"
          sha=$(sha256sum "$ASSET" | cut -d' ' -f1)
          url="https://github.com/${GH_REPO}/releases/download/${TAG}/${ASSET}"
          {
            echo "## OWNER TEST BUILD"
            echo
            echo "A test build for the owner's phone, not a release. BuildPlan Model Preview, arm64-v8a, debug."
            echo
            echo "Direct download: ${url}"
            echo
            echo "Built by workflow_dispatch run ${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT}) from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}:"
            echo "${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
            echo "SHA-256 ${sha}"
            echo
            echo '```'; cat apks/VERSION.txt; echo '```'
            echo
            echo "Signed with the preview key: it installs as an update over any preview build with a lower run number."
            echo "Every dispatch replaces this asset in place. The tag \`${TAG}\` is a fixed anchor; the commit above is the one this APK was built from."
            echo "Separate from \`preview-latest\`, which this build does not touch."
          } > notes.md
          title="BuildPlan — OWNER TEST BUILD (arm64)"
          if out=$(gh release view "$TAG" --json tagName 2>&1); then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --prerelease --title "$title" --notes-file notes.md
            action="replaced the asset of the existing release"
          elif grep -q "release not found" <<<"$out"; then
            gh release create "$TAG" "$ASSET" --prerelease --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
            action="created the release"
          else
            echo "$out"; echo "::error::could not read the ${TAG} release"; exit 1
          fi
          [ "$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)" = "true" ] || { echo "::error::${TAG} is not a prerelease"; exit 1; }
          # The link serves this exact APK, not a zip around it.
          curl -sSfL --retry 3 -o downloaded.apk "$url"
          cmp downloaded.apk "$ASSET"
          echo "### OWNER direct APK" >> "$GITHUB_STEP_SUMMARY"
          echo "${action}: $url (SHA-256 $sha)" >> "$GITHUB_STEP_SUMMARY"

  dependency-security:
    name: Dependency security (advisory)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_ui_evidence) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
