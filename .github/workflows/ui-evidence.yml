name: UI evidence

# INTEGRATION-003C, house-first since 004A. The product's screens on an
# emulator the owner's way: the journey on the house — the stage sheet, the
# construction time machine, the layers pane, the inspector, the menu, the
# source sheet, the analyzer task and the return to the same house — at font
# scale 1.0 and 1.3 (ProductFlowDeviceTest), landscape, lifecycle, unhappy
# paths, collisions, a phone with no house (NoHouseDeviceTest), the Marcówki,
# Rarytasy and Kosaćce links analysed on the phone and carried through the
# house, progress and history (VerticalSliceDeviceTest), and the alternate
# Marcówki publisher read on its evidence (GenericSourceDeviceTest). Every
# required screenshot must exist, decode and have the screen's size, or the
# gate fails (tools/validate-ui-evidence.mjs).
#
# Dispatched alone for a quick look at the screens, and called by BuildApp CI,
# where it gates the owner's APK.
on:
  workflow_dispatch:
    inputs:
      slices:
        description: "Also analyse the Marcówki, Rarytasy, Kosaćce and alternate-publisher links through the app"
        type: boolean
        default: true
  workflow_call:
    inputs:
      slices:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ui-evidence:
    name: Android / UI evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MARCOWKI_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-marcowkach-ge-m2fa281446a8ca
      SECOND_HOUSE_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-rarytasach-5-g2e-m84f2903cb8e14
      THIRD_HOUSE_URL: https://www.archon.pl/projekty-domow/projekt-dom-w-kosaccach-46-mf6628752fa61f
      GENERIC_URL: https://www.projektydomownowoczesnych.pl/p,m2fa281446a8ca,dom-w-marcowkach-ge
      SLICES: ${{ inputs.slices && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Android 35 SDK, the NDK and CMake
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Install JS dependencies
        run: npm ci
      - name: The app with the embedded analyzer, and the instrumentation APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The product on the emulator (Pixel 6 profile, x86_64, API 34, ANGLE on SwiftShader)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: OUT=ui-evidence bash apps/android/tools/run-ui-evidence.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "### UI evidence gate — $(cat ui-evidence/status.txt 2>/dev/null || echo NOT_RUN)"; echo
            echo "Marcówki slice: $(cat ui-evidence/slice-marcowki-status.txt 2>/dev/null || echo NOT_RUN)"
            echo "Rarytasy slice: $(cat ui-evidence/slice-rarytasy-status.txt 2>/dev/null || echo NOT_RUN)"
            echo "Kosaćce slice: $(cat ui-evidence/slice-kosacce-status.txt 2>/dev/null || echo NOT_RUN)"
            echo "Alternate Marcówki (generic reader): $(cat ui-evidence/generic-alternate-status.txt 2>/dev/null || echo NOT_RUN) $(grep -o '"outcome": "[^"]*"' ui-evidence/ui-evidence/generic-alternate-manifest.json 2>/dev/null || true)"; echo
            echo '```'; cat ui-evidence/device.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence
          if-no-files-found: ignore
          retention-days: 30
          path: ui-evidence/**
